services:
  nginx:
    image: nginx:1.26-alpine
    container_name: blog_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./be:/var/www/html
    depends_on:
      - backend
      - frontend
    networks:
      - blog_network

  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    container_name: blog_backend
    restart: unless-stopped
    volumes:
      - ./be:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-blog_db}
      - DB_USERNAME=${DB_USERNAME:-blog_user}
      - DB_PASSWORD=${DB_PASSWORD:-blog_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_32_chars_long}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - blog_network

  frontend:
    build:
      context: ./fe/frontend
      dockerfile: ../../docker/frontend/Dockerfile
    container_name: blog_frontend
    restart: unless-stopped
    volumes:
      - ./fe/frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    networks:
      - blog_network

  postgres:
    image: postgres:16.3-alpine
    container_name: blog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-blog_db}
      POSTGRES_USER: ${DB_USERNAME:-blog_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blog_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-blog_user} -d ${DB_DATABASE:-blog_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - blog_network

  redis:
    image: redis:7.2-alpine
    container_name: blog_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blog_network

networks:
  blog_network:
    driver: bridge

volumes:
  pgdata:
  redis_data: