services:
  nginx:
    image: nginx:1.26-alpine
    container_name: blog_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./be:/var/www/html
    depends_on:
      - backend
      - frontend
    networks:
      - blog_network

  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    container_name: blog_backend
    restart: unless-stopped
    volumes:
      - ./be:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY:-}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-blog_platform}
      - DB_USERNAME=${DB_USERNAME:-blog_user}
      - DB_PASSWORD=${DB_PASSWORD:-blog_secret}
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog_network
    command: sh -c "composer install --no-interaction --prefer-dist && php-fpm"

  frontend:
    build:
      context: ./fe/frontend
      dockerfile: ../../docker/frontend/Dockerfile
    container_name: blog_frontend
    restart: unless-stopped
    volumes:
      - ./fe/frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    networks:
      - blog_network

  mysql:
    image: mysql:8.4
    container_name: blog_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-blog_platform}
      MYSQL_USER: ${DB_USERNAME:-blog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-blog_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USERNAME:-blog_user}", "-p${DB_PASSWORD:-blog_secret}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - blog_network

networks:
  blog_network:
    driver: bridge

volumes:
  mysql_data:
